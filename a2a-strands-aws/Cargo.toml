[package]
name = "a2a-strands-aws"
version = "0.1.0"
edition = "2024"

[lib]
name = "a2a_benchmark_rust"
path = "src/lib.rs"

[dependencies]
a2a = { version = "0.4.2", package = "a2a-lf" }
a2a-server = { version = "0.5.3", package = "a2a-server-lf" }
axum = "0.8.9"
chrono = "0.4.45"
futures = "0.3.34"
num-bigint = "0.5.1"
num-traits = "0.2.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
